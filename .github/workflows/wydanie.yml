# Buduje instalatory Windows (.exe) i macOS (.dmg, Intel + Apple Silicon) i publikuje je jako wydanie (Release)
# z plikiem latest.json dla automatycznych aktualizacji.
# Uruchamianie: GitHub → zakładka Actions → „Wydanie aplikacji” → Run workflow → wpisz numer wersji.
name: Wydanie aplikacji

on:
  workflow_dispatch:
    inputs:
      wersja:
        description: "Numer nowej wersji, np. 0.16.0 (zawsze wyższy niż poprzedni)"
        required: true
      opis:
        description: "Co nowego — zobaczą to użytkownicy w oknie aktualizacji"
        required: false
        default: "Poprawki i ulepszenia"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1 # po kolei, żeby oba systemy dopisały się do tego samego latest.json
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalacja bibliotek
        run: npm ci

      - name: Gdzie publikować wydania
        id: dest
        shell: bash
        run: |
          REPO="${{ vars.RELEASES_REPO }}"
          if [ -z "$REPO" ]; then REPO="${{ github.repository }}"; fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO##*/}" >> "$GITHUB_OUTPUT"

      - name: Numer wersji i adres aktualizacji
        shell: bash
        run: node scripts/set-version.mjs "${{ inputs.wersja }}" "${{ steps.dest.outputs.repo }}"

      - name: Budowa instalatora i publikacja
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: ${{ steps.dest.outputs.owner }}
          repo: ${{ steps.dest.outputs.name }}
          tagName: v${{ inputs.wersja }}
          releaseCommitish: ${{ vars.RELEASES_REPO != '' && 'main' || github.sha }}
          releaseName: "Zarządca ${{ inputs.wersja }}"
          releaseBody: ${{ inputs.opis }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
