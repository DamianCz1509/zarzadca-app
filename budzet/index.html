<body>
<title>Bilans Domowy</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — sidebar on desktop (Mac), bottom tab bar + "+" button on phone; one column of cards, two on wide screens. */
:root {
  --bg: #f2f4f2; --surface: #ffffff; --surface-2: #eaeeeb; --ink: #15211d; --ink-2: #4c5954; --muted: #77827d;
  --line: #dbe1dd; --grid: #e7ebe8; --axis: #c3cbc7;
  --accent: #0e5e4b; --accent-ink: #ffffff; --accent-soft: #dcebe4;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #6250d6; --inc: #008300;
  --good-text: #006300; --crit: #d03b3b; --crit-soft: #fbe6e5; --warn: #b77a00;
  --shadow: 0 1px 2px rgba(21,33,29,.06), 0 8px 24px rgba(21,33,29,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1210; --surface: #161c1a; --surface-2: #1f2724; --ink: #e6ece9; --ink-2: #b3bdb8; --muted: #86918c;
  --line: #2a3330; --grid: #232b28; --axis: #3a4440;
  --accent: #5cc7a5; --accent-ink: #062219; --accent-soft: #1b3a30;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9; --inc: #2a9d2a;
  --good-text: #3fbf3f; --crit: #e66767; --crit-soft: #3a1f1f; --warn: #e0a531;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1210; --surface: #161c1a; --surface-2: #1f2724; --ink: #e6ece9; --ink-2: #b3bdb8; --muted: #86918c;
  --line: #2a3330; --grid: #232b28; --axis: #3a4440;
  --accent: #5cc7a5; --accent-ink: #062219; --accent-soft: #1b3a30;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9; --inc: #2a9d2a;
  --good-text: #3fbf3f; --crit: #e66767; --crit-soft: #3a1f1f; --warn: #e0a531;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* shell */
.shell { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.side { display: none; }
main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(104px + env(safe-area-inset-bottom, 0px)); max-width: 1180px; width: 100%; margin: 0 auto; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 16px; height: 16px; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: repeat(2, 1fr) 72px repeat(2, 1fr); align-items: center; }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--muted); border-radius: 10px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.fab { justify-self: center; width: 54px; height: 54px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow); margin-top: -22px; }
.fab svg { width: 26px; height: 26px; }

@media (min-width: 880px) {
  .shell { grid-template-columns: 232px 1fr; }
  .side { display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; padding: 22px 16px; border-right: 1px solid var(--line); background: var(--surface); }
  .side nav { display: flex; flex-direction: column; gap: 2px; }
  .side .tab { flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 14px; padding: 9px 12px; color: var(--ink-2); }
  .side .tab svg { width: 19px; height: 19px; }
  .side .tab[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
  .side .tab[aria-current="page"] svg { color: var(--accent); }
  .side-add { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .side-foot { margin-top: auto; font-size: 12px; color: var(--muted); }
  .tabbar { display: none; }
  main { padding-block: 28px 48px; padding-left: 36px; padding-right: 36px; }
}

/* page header */
.page-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.page-head h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.mobile-brand { display: flex; }
@media (min-width: 880px) { .mobile-brand { display: none; } }
.month { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.month button { background: none; border: 0; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-2); }
.month button:hover { background: var(--surface-2); }
.month span { min-width: 132px; text-align: center; font-weight: 600; font-size: 14px; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 500; font-size: 14px; }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn-danger { color: var(--crit); }
.btn-danger[data-armed] { background: var(--crit); color: #fff; border-color: transparent; }
.btn-sm { padding: 6px 10px; font-size: 13px; }

/* cards */
.grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 1020px) { .grid-2 { grid-template-columns: 1.15fr 1fr; align-items: start; } }
.stack { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: 13px; }

.banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }

/* hero */
.hero { display: grid; gap: 16px; grid-template-columns: 1fr; margin-bottom: 16px; }
@media (min-width: 700px) { .hero { grid-template-columns: 1.3fr 2fr; } }
.free { background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 6px; }
.free .lbl { font-size: 13px; opacity: .85; }
.free .big { font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 6vw, 46px); letter-spacing: -.03em; line-height: 1.05; }
.free .sub { font-size: 13px; opacity: .85; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .lbl { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.tile .val { font-family: var(--f-display); font-weight: 600; font-size: clamp(18px, 3.2vw, 24px); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .meta { font-size: 12px; color: var(--muted); }
@media (max-width: 420px) { .tiles { grid-template-columns: 1fr 1fr; } .tiles .tile:last-child { grid-column: span 2; } }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }

/* category rows */
.stackbar { display: flex; gap: 2px; height: 14px; border-radius: 5px; overflow: hidden; margin-bottom: 16px; background: var(--surface-2); }
.stackbar span { display: block; height: 100%; min-width: 3px; }
.rows { display: grid; gap: 12px; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; }
.row .name { font-weight: 500; min-width: 0; }
.row .name small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { text-align: right; font-weight: 600; }
.row .amt small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.meter { grid-column: 2 / 4; height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--ink-2); }
.meter.over i { background: var(--crit); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--crit-soft); color: var(--crit); margin-left: 6px; vertical-align: 1px; }

/* entries list */
.list { display: grid; }
.entry { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 6px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; border-radius: 0; }
.entry:first-child { border-top: 0; }
.entry:hover { background: var(--surface-2); }
.ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); }
.ico .dot { width: 11px; height: 11px; }
.entry .t { min-width: 0; }
.entry .t b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry .t small { color: var(--muted); font-size: 12px; }
.entry .a { font-weight: 600; text-align: right; white-space: nowrap; }
.a.in { color: var(--good-text); }
.a.save { color: var(--ink-2); }
.rec { font-size: 11px; color: var(--accent); font-weight: 600; margin-left: 4px; }
.day { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 14px 6px 4px; }
.empty { color: var(--muted); padding: 18px 6px; text-align: center; font-size: 14px; }

.pending { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.pending:first-of-type { border-top: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* goal */
.goalbar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; margin: 10px 0 8px; }
.goalbar i { display: block; height: 100%; background: var(--c6); border-radius: 5px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; text-align: right; font-weight: 600; }

/* chart */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-wrap text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 10px; padding: 10px 12px; font-size: 12px; min-width: 190px; z-index: 5; }
.tip b { display: block; font-size: 13px; margin-bottom: 6px; }
.tip div { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.tip div span:first-child { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.tip hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
@media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; font-weight: 600; color: var(--ink-2); }
td.neg { color: var(--crit); }
.delta-up { color: var(--crit); font-size: 12px; } .delta-down { color: var(--good-text); font-size: 12px; }

/* settings */
.field { display: grid; gap: 5px; }
.field label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; min-width: 0; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.inline { display: flex; gap: 8px; }
.inline .input { flex: 1; }
.limits { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .limits { grid-template-columns: 1fr 1fr; } }
.srcs { display: grid; gap: 6px; margin-bottom: 10px; }
.src { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px 6px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
.src button { border: 0; background: none; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; }
.src button:hover { color: var(--crit); background: var(--crit-soft); }
.hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
textarea.input { min-height: 110px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(8,14,12,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; border-radius: 20px 20px 0 0; max-height: 92vh; overflow-y: auto;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 20px; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h3 { margin: 0; font-family: var(--f-display); font-size: 21px; letter-spacing: -.01em; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 9px 4px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.amount { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.amount:focus-within { border-color: var(--accent); }
.amount input { border: 0; background: none; font-family: var(--f-display); font-weight: 700; font-size: 40px; letter-spacing: -.02em; width: 100%; min-width: 0; outline: none; }
.amount span { font-size: 18px; color: var(--muted); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.check small { display: block; color: var(--muted); font-size: 12px; }
.err { color: var(--crit); font-size: 13px; margin: -6px 0 0; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.actions .spacer { flex: 1; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 60; box-shadow: var(--shadow); }
@media (min-width: 880px) { .toast { bottom: 28px; } }
@media (prefers-reduced-motion: no-preference) { .sheet.enter { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

<div class="shell">
  <aside class="side" aria-label="Nawigacja">
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 16 16" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"><path d="M3 12V7M8 12V4M13 12V9"/></svg></span>Bilans Domowy</div>
    <button class="btn btn-primary side-add" data-action="add"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>Dodaj wpis</button>
    <nav id="side-nav"></nav>
    <div class="side-foot">Skrót: <b>N</b> — nowy wpis<br>Dane zapisują się na tym urządzeniu.</div>
  </aside>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Nawigacja"></nav>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
(() => {
'use strict';
const KEY = 'bilans-domowy:v1';
const CATS = [
  { id: 'kredyt',      name: 'Kredyt',          hint: 'rata, odsetki, nadpłata',              c: 'var(--c1)' },
  { id: 'dom',         name: 'Utrzymanie domu', hint: 'czynsz, media, internet, ubezpieczenie', c: 'var(--c2)' },
  { id: 'zycie',       name: 'Życie',           hint: 'jedzenie, transport, zdrowie, dzieci',   c: 'var(--c3)' },
  { id: 'jednorazowe', name: 'Jednorazowe',     hint: 'remont, sprzęt, wakacje',               c: 'var(--c4)' },
  { id: 'pozostale',   name: 'Pozostałe',       hint: 'restauracje, prezenty, inne',           c: 'var(--c5)' },
];
const SAVE_C = 'var(--c6)', INC_C = 'var(--inc)';
const catById = Object.fromEntries(CATS.map(c => [c.id, c]));
const ICONS = {
  pulpit: '<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/>',

/* ---------- formatting ---------- */
const f0 = new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN', maximumFractionDigits: 0 });
const f2 = new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN', minimumFractionDigits: 0, maximumFractionDigits: 2 });
const fC = new Intl.NumberFormat('pl-PL', { notation: 'compact', maximumFractionDigits: 1 });
const money = v => f0.format(Math.round(v)).replace(/ /g, ' ');
const money2 = v => f2.format(v).replace(/ /g, ' ');
const pct = v => isFinite(v) ? Math.round(v * 100) + '%' : '—';
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const pad = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
const todayISO = () => { const d = new Date(); return iso(d.getFullYear(), d.getMonth(), d.getDate()); };
const ymNow = () => todayISO().slice(0, 7);
const ymAdd = (ym, k) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return cap(new Date(y, m - 1, 1).toLocaleDateString('pl-PL', { month: 'long', year: 'numeric' })); };
const ymShort = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('pl-PL', { month: 'short' }).replace('.', ''); };
const dayLabel = d => { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd).toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' }); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const parseAmount = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : NaN; };

/* ---------- data ---------- */
function demo() {
  const now = new Date();
  let seed = 11; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const S = { v: 1, demo: true,
    sources: ['Wynagrodzenie', 'Premia', 'Najem mieszkania', 'Doradztwo'],

    goal: { name: 'Poduszka finansowa', target: 60000, start: 18000 },
    entries: [] };
  for (let k = 5; k >= 0; k--) {
    const d = new Date(now.getFullYear(), now.getMonth() - k, 1), y = d.getFullYear(), m = d.getMonth();
    const last = k === 0 ? now.getDate() : daysIn(y, m);
    const add = (day, type, amount, extra) => { if (day <= last) S.entries.push({ id: uid(), type, amount: Math.round(amount), date: iso(y, m, day), note: '', recurring: false, ...extra }); };
    add(1, 'in', 14500, { src: 'Wynagrodzenie', note: 'Pensja', recurring: true });
    add(2, 'in', 2800, { src: 'Najem mieszkania', note: 'Najem — Mokotowska', recurring: true });
    if (m % 3 === 2) add(15, 'in', 6000, { src: 'Premia', note: 'Premia kwartalna' });
    if (k === 4 || k === 1) add(20, 'in', 2400 + Math.round(r() * 1200), { src: 'Doradztwo', note: 'Faktura — doradztwo' });
    add(5, 'out', 4180, { cat: 'kredyt', note: 'Rata kredytu hipotecznego', recurring: true });
    add(1, 'out', 820, { cat: 'dom', note: 'Czynsz administracyjny', recurring: true });
    add(10, 'out', 220 + r() * 160, { cat: 'dom', note: 'Prąd i gaz' });
    add(12, 'out', 89, { cat: 'dom', note: 'Internet i TV', recurring: true });
    [3, 10, 17, 24].forEach(dd => add(dd, 'out', 440 + r() * 300, { cat: 'zycie', note: 'Zakupy spożywcze' }));
    add(8, 'out', 360 + r() * 180, { cat: 'zycie', note: 'Paliwo' });
    add(22, 'out', 340 + r() * 180, { cat: 'zycie', note: 'Paliwo' });
    add(14, 'out', 120 + r() * 260, { cat: 'zycie', note: 'Zdrowie i apteka' });
    add(6, 'out', 280, { cat: 'zycie', note: 'Zajęcia dzieci', recurring: true });
    if (k === 3) add(18, 'out', 6200, { cat: 'jednorazowe', note: 'Wakacje — Chorwacja' });
    if (k === 1) add(9, 'out', 1750, { cat: 'jednorazowe', note: 'Serwis samochodu' });
    if (k === 0) add(4, 'out', 640, { cat: 'jednorazowe', note: 'Opony zimowe' });
    add(13, 'out', 180 + r() * 220, { cat: 'pozostale', note: 'Restauracje' });
    add(27, 'out', 100 + r() * 300, { cat: 'pozostale', note: 'Prezenty i rozrywka' });
    add(2, 'save', 2500, { note: 'Poduszka finansowa', recurring: true });
    add(25, 'save', 500, { note: 'IKE', recurring: true });
  }
  return S;
}
function blank() { return { v: 1, demo: false, sources: ['Wynagrodzenie'], limits: {}, goal: { name: 'Poduszka finansowa', target: 0, start: 0 }, entries: [] }; }
function load() { try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.entries)) return d; } } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let S = load() || demo();
const ui = { view: 'pulpit', ym: ymNow(), filter: 'all', range: 6, sheet: null, exportText: '' };
const initialHash = (location.hash || '').slice(1);
if (VIEWS.some(v => v[0] === initialHash)) ui.view = initialHash;

/* ---------- calculations ---------- */
function stats(ym) {
  const es = S.entries.filter(e => e.date.slice(0, 7) === ym);
  const o = { ym, inc: 0, out: 0, save: 0, byCat: Object.fromEntries(CATS.map(c => [c.id, 0])), bySrc: {}, entries: es };
  for (const e of es) {
    if (e.type === 'in') { o.inc += e.amount; o.bySrc[e.src || 'Inne'] = (o.bySrc[e.src || 'Inne'] || 0) + e.amount; }
    else if (e.type === 'out') { o.out += e.amount; o.byCat[e.cat] = (o.byCat[e.cat] || 0) + e.amount; }
    else if (e.type === 'save') o.save += e.amount;
  }
  o.free = o.inc - o.out - o.save;
  o.rate = o.inc ? o.save / o.inc : NaN;
  return o;
}
const keyOf = e => [e.type, e.cat || '', e.src || '', (e.note || '').trim().toLowerCase()].join('|');
function pendingFor(ym) {
  const prev = S.entries.filter(e => e.recurring && e.date.slice(0, 7) === ymAdd(ym, -1));
  const have = new Set(S.entries.filter(e => e.date.slice(0, 7) === ym).map(keyOf));
  return prev.filter(e => !have.has(keyOf(e)));
}
function shiftToMonth(e, ym) {
  const [y, m] = ym.split('-').map(Number); const day = Math.min(Number(e.date.slice(8, 10)), daysIn(y, m - 1));
  return { ...e, id: uid(), date: `${ym}-${pad(day)}` };
}
const totalSaved = () => (Number(S.goal?.start) || 0) + S.entries.filter(e => e.type === 'save').reduce((a, e) => a + e.amount, 0);
function avgCosts(ym, n = 3) {
  const arr = []; for (let k = 1; k <= n; k++) { const s = stats(ymAdd(ym, -k)); if (s.entries.length) arr.push(s.out); }
  return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : NaN;
}

function entryRow(e) {
  const isIn = e.type === 'in', isSave = e.type === 'save';

}

/* ---------- views ---------- */
function viewPulpit() {
  const s = stats(ui.ym), prev = stats(ymAdd(ui.ym, -1));
  const pend = pendingFor(ui.ym);
  const pIn = pend.filter(e => e.type === 'in').reduce((a, e) => a + e.amount, 0);
  const pOut = pend.filter(e => e.type !== 'in').reduce((a, e) => a + e.amount, 0);
  const diff = (a, b) => { if (!b) return ''; const d = (a - b) / b; return `${d >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(d * 100))}% m/m`; };

  const catRows = CATS.map(c => {
    const v = s.byCat[c.id] || 0, lim = Number(S.limits?.[c.id]) || 0;
    const over = lim && v > lim;
    return `<div class="row"><span class="dot" style="background:${c.c}"></span>
      <span class="name">${c.name}${over ? `<span class="pill">! ponad limit</span>` : ''}<small>${lim ? `${money(v)} z ${money(lim)} limitu` : c.hint}</small></span>
      <span class="amt num">${money(v)}<small>${s.out ? pct(v / s.out) : '—'}</small></span>
      ${lim ? `<span class="meter ${over ? 'over' : ''}"><i style="width:${Math.min(100, v / lim * 100)}%"></i></span>` : ''}</div>`;
  }).join('');
  const bar = s.out ? `<div class="stackbar" role="img" aria-label="Udział kategorii w wydatkach">${CATS.filter(c => s.byCat[c.id] > 0).map(c => `<span title="${c.name}: ${money(s.byCat[c.id])}" style="flex:${s.byCat[c.id]};background:${c.c}"></span>`).join('')}</div>` : '';

  const srcEntries = Object.entries(s.bySrc).sort((a, b) => b[1] - a[1]);
  const srcRows = srcEntries.length ? srcEntries.map(([n, v]) => `<div class="row"><span class="dot" style="background:${INC_C}"></span><span class="name">${esc(n)}</span><span class="amt num">${money(v)}<small>${pct(v / s.inc)}</small></span></div>`).join('') : `<div class="empty">Brak przychodów w tym miesiącu.</div>`;

  const saved = totalSaved(), tgt = Number(S.goal?.target) || 0, avg = avgCosts(ui.ym) || s.out;
  const recent = [...s.entries].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);

  return head('Pulpit') + demoBanner() + `
  <section class="hero">
    <div class="free"><span class="lbl">Wolne środki · ${ymLabel(ui.ym)}</span><span class="big num">${money(s.free)}</span>
      <span class="sub">przychody − wydatki − oszczędności${pend.length ? `<br>Prognoza po stałych pozycjach: <b>${money(s.free + pIn - pOut)}</b>` : ''}</span></div>
    <div class="tiles">
      <div class="tile"><span class="lbl"><span class="dot" style="background:${INC_C}"></span>Przychody</span><span class="val num">${money(s.inc)}</span><span class="meta">${diff(s.inc, prev.inc) || '&nbsp;'}</span></div>
      <div class="tile"><span class="lbl"><span class="dot" style="background:var(--ink-2)"></span>Wydatki</span><span class="val num">${money(s.out)}</span><span class="meta">${diff(s.out, prev.out) || '&nbsp;'}</span></div>
      <div class="tile"><span class="lbl"><span class="dot" style="background:${SAVE_C}"></span>Odłożone</span><span class="val num">${money(s.save)}</span><span class="meta">stopa oszczędności ${pct(s.rate)}</span></div>
    </div>
  </section>
  <div class="grid grid-2">
    <div class="stack">
      <section class="card"><h2>Wydatki wg kategorii <small>${money(s.out)}</small></h2>${bar}<div class="rows">${catRows}</div></section>
      <section class="card"><h2>Ostatnie wpisy <button class="btn btn-ghost btn-sm" data-view="historia">Wszystkie</button></h2>
        <div class="list">${recent.length ? recent.map(entryRow).join('') : `<div class="empty">Brak wpisów. Dodaj pierwszy przyciskiem „+”.</div>`}</div></section>
    </div>
    <div class="stack">
      ${pend.length ? `<section class="card"><h2>Stałe pozycje do zaksięgowania <button class="btn btn-sm" data-action="add-all-pending">Dodaj wszystkie</button></h2>
        <p class="hint">Pozycje oznaczone jako stałe w poprzednim miesiącu, których jeszcze nie ma w tym.</p>
        ${pend.map(e => `<div class="pending"><span>${esc(e.note || catById[e.cat]?.name || e.src || 'Pozycja')}<br><small style="color:var(--muted)">${e.type === 'in' ? esc(e.src) : e.type === 'save' ? 'Oszczędności' : catById[e.cat]?.name} · ${Number(e.date.slice(8))}. dzień miesiąca</small></span><span class="num" style="font-weight:600">${e.type === 'in' ? '+' : '−'}${money(e.amount)}</span><button class="btn btn-sm" data-pending="${e.id}">Dodaj</button></div>`).join('')}</section>` : ''}
      <section class="card"><h2>Przychody wg źródeł <small>${money(s.inc)}</small></h2><div class="rows">${srcRows}</div></section>
      <section class="card"><h2>${esc(S.goal?.name || 'Oszczędności')} <small>${tgt ? pct(saved / tgt) + ' celu' : ''}</small></h2>

}

function viewHistoria() {

    .sort((a, b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1));

function viewAnaliza() {
  const months = []; for (let k = ui.range - 1; k >= 0; k--) months.push(stats(ymAdd(ui.ym, -k)));
  const used = months.filter(m => m.entries.length);
  const avg = f => used.length ? used.reduce((a, m) => a + f(m), 0) / used.length : 0;
  const aInc = avg(m => m.inc), aOut = avg(m => m.out), aSave = avg(m => m.save);
  const cur = months[months.length - 1];
  const catAvg = Object.fromEntries(CATS.map(c => [c.id, avg(m => m.byCat[c.id] || 0)]));
  return head('Analiza') + `
    <div class="kpis">

      <div class="legend"><span><i class="dot" style="background:${INC_C}"></i>Przychody</span>${CATS.map(c => `<span><i class="dot" style="background:${c.c}"></i>${c.name}</span>`).join('')}<span><i class="dot" style="background:${SAVE_C}"></i>Oszczędności</span></div>

        <tbody>${CATS.map(c => { const v = cur.byCat[c.id] || 0, a = catAvg[c.id], d = v - a;
          return `<tr><td><span class="dot" style="background:${c.c};margin-right:8px"></span>${c.name}</td><td>${money(v)}</td><td>${money(a)}</td><td class="${d > 0 ? 'delta-up' : 'delta-down'}">${d > 0 ? '+' : ''}${money(d)}</td></tr>`; }).join('')}</tbody></table></div>

    </div>`;
}

function niceStep(v) { if (v <= 0) return 250; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function barPath(x, y, w, h, r) { r = Math.min(r, h, w / 2); if (h <= 0) return ''; return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function chartSVG(months) {
  const W = 680, H = 270, L = 48, R = 8, T = 10, B = 26, pw = W - L - R, ph = H - T - B;
  const top = Math.max(...months.map(m => Math.max(m.inc, m.out + m.save)), 1), step = niceStep(top / 5), nT = Math.max(1, Math.ceil(top / step)), max = step * nT;
  const y = v => T + ph - v / max * ph;
  const gw = pw / months.length, bw = Math.max(6, Math.min(22, gw * 0.3)), gap = 3;
  let g = '';
  for (let i = 0; i <= nT; i++) { const v = step * i, yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${i ? 'var(--grid)' : 'var(--axis)'}" stroke-width="1"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${v ? fC.format(v) : '0'}</text>`; }
  months.forEach((m, i) => {
    const cx = L + gw * i + gw / 2, x1 = cx - bw - gap / 2, x2 = cx + gap / 2;
    if (m.inc) g += `<path d="${barPath(x1, y(m.inc), bw, y(0) - y(m.inc), 4)}" fill="var(--inc)"/>`;
    const segs = [...CATS.map(c => [m.byCat[c.id] || 0, c.c]), [m.save, 'var(--c6)']].filter(s => s[0] > 0);
    let acc = 0;
    segs.forEach(([v, col], j) => {
      const top = y(acc + v), bot = y(acc), h = bot - top - (j ? 2 : 0);
      const isTop = j === segs.length - 1;
      g += isTop ? `<path d="${barPath(x2, top, bw, Math.max(0, h), 4)}" fill="${col}"/>` : `<rect x="${x2}" y="${top}" width="${bw}" height="${Math.max(0, h)}" fill="${col}"/>`;
      acc += v;
    });
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${ymShort(m.ym)}</text>`;
    g += `<rect class="hit" data-i="${i}" x="${L + gw * i}" y="${T}" width="${gw}" height="${ph}" fill="transparent"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres słupkowy: przychody oraz wydatki i oszczędności w kolejnych miesiącach">${g}</svg>`;
}
function bindChart() {
  const wrap = document.getElementById('chart'); if (!wrap) return;
  const months = []; for (let k = ui.range - 1; k >= 0; k--) months.push(stats(ymAdd(ui.ym, -k)));
  let tip = null;
  const hide = () => { tip?.remove(); tip = null; };
  wrap.addEventListener('pointermove', ev => {
    const hit = ev.target.closest('.hit'); if (!hit) return hide();
    const m = months[+hit.dataset.i];
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; wrap.appendChild(tip); }
    tip.innerHTML = `<b>${ymLabel(m.ym)}</b><div><span><i class="dot" style="background:${INC_C}"></i>Przychody</span><span class="num">${money(m.inc)}</span></div><hr>` +
      CATS.map(c => `<div><span><i class="dot" style="background:${c.c}"></i>${c.name}</span><span class="num">${money(m.byCat[c.id] || 0)}</span></div>`).join('') +
      `<div><span><i class="dot" style="background:${SAVE_C}"></i>Oszczędności</span><span class="num">${money(m.save)}</span></div><hr><div><span>Wolne środki</span><b class="num" style="margin:0">${money(m.free)}</b></div>`;
    const rb = wrap.getBoundingClientRect(), tw = tip.offsetWidth;
    let x = ev.clientX - rb.left + 14; if (x + tw > rb.width) x = ev.clientX - rb.left - tw - 14; if (x < 0) x = 0;
    tip.style.left = x + 'px'; tip.style.top = Math.max(0, ev.clientY - rb.top - 60) + 'px';
  });
  wrap.addEventListener('pointerleave', hide);
}

function viewUstawienia() {
  return head('Ustawienia', false) + demoBanner() + `<div class="grid grid-2"><div class="stack">
    <section class="card"><h2>Źródła przychodów</h2><p class="hint">Pojawiają się do wyboru przy dodawaniu przychodu.</p>
      <div class="srcs">${S.sources.map((s, i) => `<div class="src"><span>${esc(s)}</span><button data-del-src="${i}" aria-label="Usuń ${esc(s)}">✕</button></div>`).join('')}</div>
      <form class="inline" id="src-form"><input class="input" id="src-name" placeholder="np. Najem garażu, Dywidendy" autocomplete="off"><button class="btn" type="submit">Dodaj</button></form></section>
    <section class="card"><h2>Limity miesięczne</h2><p class="hint">Pulpit pokaże pasek postępu i ostrzeżenie po przekroczeniu. Puste pole = bez limitu.</p>
      <div class="limits">${CATS.map(c => `<div class="field"><label for="lim-${c.id}">${c.name}</label><input class="input num" id="lim-${c.id}" data-limit="${c.id}" inputmode="decimal" placeholder="bez limitu" value="${S.limits?.[c.id] || ''}"></div>`).join('')}</div></section>
  </div><div class="stack">
    <section class="card"><h2>Cel oszczędnościowy</h2>
      <div class="limits"><div class="field" style="grid-column:1/-1"><label for="goal-name">Nazwa celu</label><input class="input" id="goal-name" data-goal="name" value="${esc(S.goal?.name || '')}"></div>
      <div class="field"><label for="goal-target">Kwota docelowa (zł)</label><input class="input num" id="goal-target" data-goal="target" inputmode="decimal" value="${S.goal?.target || ''}"></div>
      <div class="field"><label for="goal-start">Stan początkowy (zł)</label><input class="input num" id="goal-start" data-goal="start" inputmode="decimal" value="${S.goal?.start || ''}"></div></div>
      <p class="hint" style="margin:10px 0 0">Stan początkowy to oszczędności zgromadzone przed rozpoczęciem korzystania z aplikacji.</p></section>
    <section class="card"><h2>Kopia danych</h2><p class="hint">Dane są zapisane tylko na tym urządzeniu. Skopiuj kopię, aby przenieść je na Maca lub telefon.</p>
      <div class="actions" style="justify-content:flex-start"><button class="btn" data-action="export">Kopiuj kopię (JSON)</button>
        <label class="btn" for="import-file" style="display:inline-block">Wgraj z pliku</label><input type="file" id="import-file" accept="application/json,.json" hidden></div>
      <div class="field" style="margin-top:12px"><label for="import-text">…lub wklej kopię tutaj</label><textarea class="input" id="import-text" placeholder='{"v":1,"entries":[…]}'>${esc(ui.exportText)}</textarea></div>
      <div class="actions" style="margin-top:10px"><button class="btn" data-action="import-text">Wczytaj wklejoną kopię</button></div></section>
    <section class="card"><h2>Dane</h2><div class="actions" style="justify-content:flex-start">
      <button class="btn btn-danger" data-action="reset">Usuń wszystkie wpisy</button><button class="btn" data-action="load-demo">Wczytaj dane przykładowe</button></div></section>
  </div></div>`;
}

/* ---------- sheet (add / edit) ---------- */
function openSheet(entry) {
  const base = entry ? { ...entry } : { type: 'out', cat: 'zycie', src: S.sources[0] || '', amount: '', date: ui.ym === ymNow() ? todayISO() : ui.ym + '-01', note: '', recurring: false };
  ui.sheet = { id: entry?.id || null, ...base, err: '' };
  renderSheet(true);
  setTimeout(() => document.getElementById('f-amount')?.focus(), 30);
}
function closeSheet() { ui.sheet = null; document.getElementById('sheet-root').innerHTML = ''; }
function readSheetFields() {
  const sh = ui.sheet; if (!sh) return;
  const a = document.getElementById('f-amount'); if (a) sh.amount = a.value;
  const n = document.getElementById('f-note'); if (n) sh.note = n.value;
  const d = document.getElementById('f-date'); if (d) sh.date = d.value;
  const r = document.getElementById('f-rec'); if (r) sh.recurring = r.checked;
}
function renderSheet(enter = false) {
  const sh = ui.sheet; if (!sh) return;
  const types = [['out', 'Wydatek'], ['in', 'Przychód'], ['save', 'Oszczędności']];
  const picker = sh.type === 'out'
    ? `<div class="field"><label>Kategoria</label><div class="chips">${CATS.map(c => `<button type="button" class="chip" data-pick-cat="${c.id}" aria-pressed="${sh.cat === c.id}"><i class="dot" style="background:${c.c}"></i>${c.name}</button>`).join('')}</div><small style="color:var(--muted);font-size:12px">${catById[sh.cat]?.hint || ''}</small></div>`
    : sh.type === 'in'
    ? `<div class="field"><label>Źródło</label><div class="chips">${S.sources.map(s => `<button type="button" class="chip" data-pick-src="${esc(s)}" aria-pressed="${sh.src === s}">${esc(s)}</button>`).join('')}</div><small style="color:var(--muted);font-size:12px">Nowe źródła dodasz w Ustawieniach.</small></div>`
    : `<p class="hint" style="margin:0">Wpłata na oszczędności zmniejsza wolne środki, ale nie jest wydatkiem. Liczy się do celu „${esc(S.goal?.name || 'Oszczędności')}”.</p>`;
  document.getElementById('sheet-root').innerHTML = `<div class="scrim" data-action="scrim"><form class="sheet${enter ? ' enter' : ''}" id="sheet-form" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><h3 id="sheet-title">${sh.id ? 'Edytuj wpis' : 'Nowy wpis'}</h3><button type="button" class="btn btn-ghost" data-action="close">Zamknij</button></div>
    <div class="seg" role="group" aria-label="Rodzaj wpisu">${types.map(([id, l]) => `<button type="button" data-type="${id}" aria-pressed="${sh.type === id}">${l}</button>`).join('')}</div>
    <div class="field"><label for="f-amount">Kwota</label><div class="amount"><input id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(sh.amount)}"><span>zł</span></div></div>
    ${sh.err ? `<p class="err">${sh.err}</p>` : ''}
    ${picker}
    <div class="two"><div class="field"><label for="f-note">Opis</label><input class="input" id="f-note" placeholder="${sh.type === 'out' ? 'np. Zakupy spożywcze' : sh.type === 'in' ? 'np. Pensja' : 'np. Poduszka, IKE'}" value="${esc(sh.note)}" autocomplete="off"></div>
      <div class="field"><label for="f-date">Data</label><input class="input" type="date" id="f-date" value="${esc(sh.date)}"></div></div>
    <label class="check" for="f-rec"><input type="checkbox" id="f-rec" ${sh.recurring ? 'checked' : ''}><span>Stała pozycja co miesiąc<small>W kolejnym miesiącu pojawi się na pulpicie do zaksięgowania jednym kliknięciem.</small></span></label>
    <div class="actions">${sh.id ? `<button type="button" class="btn btn-danger" data-action="delete-entry">Usuń</button><span class="spacer"></span>` : ''}<button type="button" class="btn" data-action="close">Anuluj</button><button type="submit" class="btn btn-primary">${sh.id ? 'Zapisz zmiany' : 'Dodaj wpis'}</button></div>
  </form></div>`;
}
function submitSheet() {
  readSheetFields(); const sh = ui.sheet;
  const amount = parseAmount(sh.amount);
  if (!(amount > 0)) { sh.err = 'Wpisz kwotę większą od zera, np. 249,99.'; renderSheet(); document.getElementById('f-amount')?.focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(sh.date)) { sh.err = 'Wybierz datę wpisu.'; renderSheet(); return; }
  if (sh.type === 'in' && !sh.src) { sh.err = 'Wybierz źródło przychodu albo dodaj je w Ustawieniach.'; renderSheet(); return; }
  const e = { id: sh.id || uid(), type: sh.type, amount, date: sh.date, note: sh.note.trim(), recurring: !!sh.recurring };
  if (sh.type === 'out') e.cat = sh.cat; if (sh.type === 'in') e.src = sh.src;
  const i = S.entries.findIndex(x => x.id === e.id);
  if (i >= 0) S.entries[i] = e; else S.entries.push(e);
  save(); closeSheet(); ui.ym = e.date.slice(0, 7); render(); toast(i >= 0 ? 'Zapisano zmiany' : 'Dodano wpis');
}

/* ---------- misc ---------- */
let toastT;
function toast(msg) { const r = document.getElementById('toast-root'); r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => r.innerHTML = '', 2200); }
function importData(text) {
  try { const d = JSON.parse(text); if (!d || !Array.isArray(d.entries)) throw 0;
    S = { ...blank(), ...d, demo: false }; save(); ui.exportText = ''; render(); toast(`Wczytano ${S.entries.length} wpisów`);
  } catch (e) { toast('To nie jest poprawna kopia danych Bilansu Domowego.'); }
}
function render() {
  renderNav();
  const v = { pulpit: viewPulpit, historia: viewHistoria, analiza: viewAnaliza, ustawienia: viewUstawienia }[ui.view];
  document.getElementById('main').innerHTML = v();
  if (ui.view === 'analiza') bindChart();
}
function go(view) { ui.view = view; try { history.replaceState(null, '', '#' + view); } catch (e) {} render(); window.scrollTo({ top: 0 }); }

document.addEventListener('click', ev => {
  const t = ev.target.closest('button, [data-action="scrim"]'); if (!t) return;
  if (t.dataset.action === 'scrim' && ev.target !== t) return;
  const d = t.dataset;
  if (d.view) return go(d.view);
  if (d.filter) { ui.filter = d.filter; return render(); }
  if (d.range) { ui.range = +d.range; return render(); }
  if (d.edit) return openSheet(S.entries.find(e => e.id === d.edit));
  if (d.type && ui.sheet) { readSheetFields(); ui.sheet.type = d.type; ui.sheet.err = ''; return renderSheet(); }
  if (d.pickCat && ui.sheet) { readSheetFields(); ui.sheet.cat = d.pickCat; return renderSheet(); }
  if (d.pickSrc !== undefined && ui.sheet) { readSheetFields(); ui.sheet.src = d.pickSrc; return renderSheet(); }
  if (d.pending) { const e = pendingFor(ui.ym).find(x => x.id === d.pending); if (e) { S.entries.push(shiftToMonth(e, ui.ym)); save(); render(); toast('Dodano stałą pozycję'); } return; }
  if (d.delSrc !== undefined) { const n = S.sources.splice(+d.delSrc, 1); save(); render(); return toast(`Usunięto źródło „${n}”`); }
  switch (d.action) {
    case 'add': return openSheet(null);
    case 'close': case 'scrim': return closeSheet();
    case 'prev': ui.ym = ymAdd(ui.ym, -1); return render();
    case 'next': ui.ym = ymAdd(ui.ym, 1); return render();
    case 'add-all-pending': { const p = pendingFor(ui.ym); p.forEach(e => S.entries.push(shiftToMonth(e, ui.ym))); save(); render(); return toast(`Dodano ${p.length} stałe pozycje`); }
    case 'delete-entry': {
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Na pewno usunąć?'; return; }
      S.entries = S.entries.filter(e => e.id !== ui.sheet.id); save(); closeSheet(); render(); return toast('Usunięto wpis');
    }
    case 'start-fresh': S = blank(); save(); ui.ym = ymNow(); render(); return toast('Gotowe. Dodaj pierwszy wpis przyciskiem „+”.');
    case 'reset':
      if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = 'Kliknij ponownie, aby usunąć'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Usuń wszystkie wpisy'; } }, 4000); return; }
      S.entries = []; S.demo = false; save(); render(); return toast('Usunięto wszystkie wpisy');
    case 'load-demo': S = demo(); save(); ui.ym = ymNow(); render(); return toast('Wczytano dane przykładowe');
    case 'export': {
      const json = JSON.stringify({ ...S, demo: undefined }, null, 1);
      ui.exportText = json;
      const showFallback = () => { const ta = document.getElementById('import-text'); if (ta) { ta.value = json; ta.select(); } toast('Kopia jest w polu poniżej — skopiuj ją ręcznie'); };
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(json).then(() => toast('Skopiowano kopię do schowka'), showFallback); else showFallback();
      return;
    }
    case 'import-text': return importData(document.getElementById('import-text').value);
  }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'sheet-form') return submitSheet();
  if (ev.target.id === 'src-form') { const v = document.getElementById('src-name').value.trim(); if (v && !S.sources.includes(v)) { S.sources.push(v); save(); render(); toast(`Dodano źródło „${v}”`); } }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.limit) { const v = parseAmount(t.value); S.limits = S.limits || {}; if (v > 0) S.limits[t.dataset.limit] = v; else delete S.limits[t.dataset.limit]; save(); toast('Zapisano limit'); }
  if (t.dataset.goal) { S.goal = S.goal || {}; S.goal[t.dataset.goal] = t.dataset.goal === 'name' ? t.value.trim() : (parseAmount(t.value) || 0); save(); toast('Zapisano cel'); }
  if (t.id === 'import-file' && t.files?.[0]) { const fr = new FileReader(); fr.onload = () => importData(fr.result); fr.readAsText(t.files[0]); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && ui.sheet) return closeSheet();
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if (!typing && !ui.sheet && (ev.key === 'n' || ev.key === 'N') && !ev.metaKey && !ev.ctrlKey) { ev.preventDefault(); openSheet(null); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.some(v => v[0] === h) && h !== ui.view) { ui.view = h; render(); } });

render();
})();
</script>
